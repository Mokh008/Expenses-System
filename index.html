<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تقديم مصروفات الإعاشة</title>

<style>
:root{
  --primary:#0F172A;
  --bg:#F8FAFC;
  --text:#020617;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.container{
  max-width:480px;
  margin:60px auto;
  background:#fff;
  border-radius:16px;
  box-shadow:0 20px 40px rgba(0,0,0,.1);
  padding:30px;
}
h1{text-align:center;color:var(--primary)}
.field{margin-bottom:20px}
label{font-weight:600;display:block;margin-bottom:6px}
input,select,button{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #CBD5E1;
  font-size:15px;
}
button{
  background:var(--primary);
  color:#fff;
  font-weight:600;
  cursor:pointer;
}
button:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.days-box{margin-top:20px;display:none}
.day{
  border:1px solid #E5E7EB;
  border-radius:8px;
  padding:10px;
  margin-bottom:8px;
  display:flex;
  gap:10px;
  align-items:center;
}
.summary{
  background:#F1F5F9;
  padding:15px;
  border-radius:10px;
  margin-top:20px;
  display:none;
}
.loader{
  display:none;
  text-align:center;
  margin-top:15px;
  font-weight:600;
}
.success{
  display:none;
  background:#DCFCE7;
  color:#166534;
  padding:12px;
  border-radius:10px;
  margin-top:15px;
  text-align:center;
  font-weight:600;
}
.footer{
  text-align:center;
  margin-top:25px;
  font-size:13px;
  color:#64748B;
}
.transport-box{
  margin-top:15px;
}
.transport-row{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:8px;
}
.transport-row span{
  flex:1;
  font-size:14px;
}
.transport-row input{
  width:120px;
}
</style>
</head>

<body>

<div class="container">
<h1>تقديم مصروفات الإعاشة</h1>

<div class="field">
<label>رقم المهندس (ID)</label>
<input type="number" id="empId" placeholder="مثال: 1001730">
</div>

<div class="field">
<label>الشهر</label>
<select id="month">
<option value="">اختر الشهر</option>
<option value="1">يناير</option>
<option value="2">فبراير</option>
<option value="3">مارس</option>
<option value="4">أبريل</option>
<option value="5">مايو</option>
<option value="6">يونيو</option>
<option value="7">يوليو</option>
<option value="8">أغسطس</option>
<option value="9">سبتمبر</option>
<option value="10">أكتوبر</option>
<option value="11">نوفمبر</option>
<option value="12">ديسمبر</option>
</select>
</div>

<button onclick="loadAttendance()">تحميل أيام الحضور</button>

<div class="days-box" id="daysBox"></div>

<div class="summary" id="summary">
  <div>عدد الأيام: <strong id="daysCount">0</strong></div>
  <div>إجمالي الإعاشة: <strong id="total">0</strong> جنيه</div>
</div>

<!-- Transportation -->
<div class="field transport-box">
  <label>مصروفات الانتقال (Transportation)</label>
  <div id="transportBox"></div>
</div>
<!-- Electricity -->
<div class="field">
  <label>فاتورة كهرباء (اختياري)</label>

  <input type="number"
         id="electricAmount"
         placeholder="المبلغ (EGP)"
         min="0"
         style="margin-bottom:10px;">

  <div style="display:flex;gap:8px;">
    <input type="number"
           id="electricYear"
           placeholder="السنة"
           min="2024" max="2100">

    <input type="number"
           id="electricMonth"
           placeholder="الشهر"
           min="1" max="12">

    <input type="number"
           id="electricDay"
           placeholder="اليوم"
           min="1" max="31">
  </div>
</div>
<button id="submitBtn" style="display:none" onclick="submitExpenses()">
إنشاء ملف المصروفات
</button>

<div class="loader" id="loader">
⏳ جاري إنشاء ملف المصروفات برجاء الانتظار...
</div>

<div class="success" id="successBox"></div>

<div class="footer">
نظام مصروفات الإعاشة
</div>
</div>

<script>
// 🔗 BACKEND URL
const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzhGVzsy3iARfV9Q5q0Z3w4ZXjr3ab1VUbuQCdEq9xepXm_uS-UfLHiKqz9uXgSBgng/exec";

// تحميل أيام الحضور
function loadAttendance(){
  const id = empId.value;
  const m  = month.value;
  if(!id || !m){
    alert("من فضلك أدخل رقم المهندس والشهر");
    return;
  }

  daysBox.style.display="block";
  daysBox.innerHTML="جاري التحميل...";
  transportBox.innerHTML="";

fetch(`${WEB_APP_URL}?action=getDays&id=${id}&month=${m}`)
  .then(r=>r.json())
  .then(data=>{
    daysBox.innerHTML="";

    if(!data.length){
      daysBox.innerHTML="لا توجد أيام حضور لهذا الشهر";
      return;
    }

    data.forEach(d=>{
      daysBox.innerHTML+=`
        <div class="day">
          <input type="checkbox"
                 data-date="${d.date}"
                 data-day="${d.day}"
                 onchange="calc()">
          ${d.date} (${d.day})
        </div>`;
    });
  })
  .catch(()=>{
    daysBox.innerHTML="حدث خطأ في الاتصال";
  });
}

// حساب الإجمالي + بناء مصروفات الانتقال
function calc(){
  const checked =
    document.querySelectorAll(".day input:checked");

  daysCount.innerText = checked.length;
  total.innerText = checked.length * 200;

  transportBox.innerHTML="";

  checked.forEach(c=>{
    const row = document.createElement("div");
    row.className = "transport-row";
    row.innerHTML = `
      <span>${c.dataset.date} (${c.dataset.day})</span>
      <input type="number"
             min="0"
             placeholder="EGP"
             data-day="${c.dataset.day}">
    `;
    transportBox.appendChild(row);
  });

  summary.style.display="block";
  submitBtn.style.display="block";
}

// تجميع حسب اليوم (الإعاشة)
function groupByWeekDay(){
  const checked =
    document.querySelectorAll(".day input:checked");
  const result={};

  checked.forEach(c=>{
    const day = c.dataset.day;
    if(!result[day]) result[day]=[];
    result[day].push(c.dataset.date);
  });

  const final={};
  for(let k in result){
    final[k]=result[k].join(" & ");
  }
  return final;
}

// تجميع مصروفات الانتقال
function collectTransportation(){
  const result = {};
  document.querySelectorAll("#transportBox input").forEach(i=>{
    if(i.value && +i.value > 0){
      result[i.dataset.day] = +i.value;
    }
  });
  return result;
}

// إرسال البيانات
function submitExpenses(){

  if(+daysCount.innerText === 0){
    alert("من فضلك اختر يوم واحد على الأقل");
    return;
  }

  submitBtn.disabled = true;
  loader.style.display="block";
  successBox.style.display="none";

  const elecAmount = +electricAmount.value || 0;
const y = +electricYear.value;
const m = +electricMonth.value;
const d = +electricDay.value;

// تحقق من صحة التاريخ لو فيه مبلغ
if(elecAmount > 0){

  if(!y || !m || !d){
    alert("من فضلك أدخل تاريخ فاتورة الكهرباء");
    return;
  }

  const testDate = new Date(y, m-1, d);

  if(testDate.getFullYear() !== y ||
     testDate.getMonth()+1 !== m ||
     testDate.getDate() !== d){
    alert("تاريخ فاتورة الكهرباء غير صحيح");
    return;
  }

  if(m !== +month.value){
    alert("شهر فاتورة الكهرباء لازم يطابق الشهر المختار");
    return;
  }
}

const payload={
  id:empId.value,
  month:month.value,
  days:+daysCount.innerText,
  total:+total.innerText,
  breakdown:groupByWeekDay(),
  transport: collectTransportation(),
  electricity:{
    amount: elecAmount,
    year: y || "",
    month: m || "",
    day: d || ""
  }
};
  fetch(WEB_APP_URL,{
    method:"POST",
    body:JSON.stringify(payload)
  })
  .then(r=>r.json())
  .then(res=>{
    loader.style.display="none";
    submitBtn.disabled = false;

    if(res.pdfUrl){
      successBox.style.display="block";
      successBox.innerHTML = `
        ✅ تم إنشاء ملف المصروفات بنجاح<br><br>
        <a href="${res.pdfUrl}" target="_blank"
           style="
             display:inline-block;
             background:#0F172A;
             color:#fff;
             padding:10px 20px;
             border-radius:10px;
             text-decoration:none;
             font-weight:600;
           ">
          📄 تحميل ملف المصروفات (PDF)
        </a>`;
    }else{
      alert("تم الحفظ ولكن لم يتم إنشاء ملف PDF");
    }
  })
  .catch(()=>{
    loader.style.display="none";
    submitBtn.disabled = false;
    alert("حدث خطأ أثناء الإرسال");
  });
}
</script>

</body>
</html>
